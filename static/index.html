<div id="app" class="craigslist-container"></div>

<script>
// ===== API =====
const API = '/api';

async function apiGet(path) {
  const r = await fetch(API + path);
  if (!r.ok) throw new Error(`API error ${r.status}`);
  return r.json();
}

async function apiAdminGet(path, password) {
  const sep = path.includes('?') ? '&' : '?';
  const r = await fetch(API + path + sep + 'password=' + encodeURIComponent(password));
  if (!r.ok) throw new Error(`API error ${r.status}`);
  return r.json();
}

async function apiPost(path, data, password) {
  const url = password ? `${API}${path}?password=${encodeURIComponent(password)}` : `${API}${path}`;
  const r = await fetch(url, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data)
  });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.detail || `API error ${r.status}`); }
  return r.json();
}

async function apiPut(path, data, password) {
  const r = await fetch(`${API}${path}?password=${encodeURIComponent(password)}`, {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data)
  });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.detail || `API error ${r.status}`); }
  return r.json();
}

async function apiDelete(path, password) {
  const r = await fetch(`${API}${path}?password=${encodeURIComponent(password)}`, { method: 'DELETE' });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.detail || `API error ${r.status}`); }
  return r.json();
}

// ===== SETTINGS (loaded once, used everywhere) =====
let S = null; // site settings

async function loadSettings() {
  try {
    S = await apiGet('/settings');
  } catch (e) {
    console.error('Failed to load settings, using defaults');
    S = {
      siteTitle: 'unhinged listings',
      subtitle: 'colorado springs > for sale / wanted > general for sale',
      tagline: 'where mundane commerce meets existential dread',
      description: 'real items for sale, written through the lens of late-stage capitalism and fourth-wall-breaking nihilism',
      categories: [
        {id:'all',name:'All Listings'},{id:'household',name:'Household Items'},
        {id:'furniture',name:'Furniture'},{id:'tools',name:'Tools & Equipment'},
        {id:'vintage',name:'Vintage & Collectibles'}
      ],
      safetyTips: "meet in public places\ndon't wire money\navoid offers that seem too good\nbeware of existential dread",
      footerText: 'unhinged listings | all rights reserved to question reality through commerce',
      footerLinks: 'help | safety | privacy | feedback | craigslist blog | best of craigslist | existential crisis support',
      aboutTitle: 'About Unhinged Listings',
      aboutIntro: '',
      aboutProcess: '',
      aboutQuote: '',
      aboutQuoteSource: '',
      aboutPhilosophy: '',
      aboutAuthenticity: '',
      aboutWarning: '',
      creatorBlurb: '',
      creatorImage: '',
      mcTitle: 'MISSED CONNECTIONS',
      mcTagline: 'fleeting encounters with strangers who will never read this',
      mcDescription: 'where desperate longing meets the void of anonymous internet confessionals',
      mcDisclaimer: 'these missed connections are fictional absurdist pieces written in the style of craigslist personals. any resemblance to actual missed connections is purely coincidental and deeply unfortunate.',
      mcEmpty: 'no missed connections yet.\nthe longing is still building.',
      emptyListingsMsg: 'no listings found in this category.\nthe void has consumed everything.',
      listingNotFoundMsg: 'this item has vanished into the void of consumer capitalism.',
      mcNotFoundMsg: 'this fleeting encounter has dissolved back into the void.',
      contactNoEmailMsg: 'Contact form coming soon. In the meantime, try yelling into the void.',
      sidebarPersonalsLabel: 'personals',
      sidebarDisclaimerLabel: 'disclaimer',
      displayMode: 'list',
      liveMarketplaceUrl: '#/darkweb',
      liveMarketplaceLabel: 'live marketplace',
      contactText: 'Serious inquiries only. Cash preferred.',
      contactEmail: '',
    };
  }
}

// ===== HELPERS =====

function esc(str) {
  if (!str) return '';
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function nl2br(str) {
  return esc(str).replace(/\n/g, '<br>');
}

function formatDate(d) {
  try { return new Date(d).toLocaleDateString(); } catch { return d; }
}

function statusClass(status) {
  if (status === 'In Stock') return 'status-available';
  if (status === 'Sold') return 'status-sold';
  if (status === 'Out of Stock') return 'status-out-of-stock';
  return '';
}

function statusText(status) {
  if (status === 'In Stock') return 'AVAILABLE';
  if (status === 'Sold') return 'SOLD';
  if (status === 'Out of Stock') return 'OUT OF STOCK';
  return status ? status.toUpperCase() : '';
}

// ===== DRAG AND DROP =====
function setupDragDrop(container, ids, endpoint, refreshFn) {
  let dragIdx = null;
  const rows = container.querySelectorAll('.drag-row');

  rows.forEach(row => {
    row.addEventListener('dragstart', (e) => {
      dragIdx = parseInt(row.dataset.idx);
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });

    row.addEventListener('dragend', () => {
      row.classList.remove('dragging');
      rows.forEach(r => r.classList.remove('drag-over'));
    });

    row.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      rows.forEach(r => r.classList.remove('drag-over'));
      row.classList.add('drag-over');
    });

    row.addEventListener('dragleave', () => {
      row.classList.remove('drag-over');
    });

    row.addEventListener('drop', async (e) => {
      e.preventDefault();
      rows.forEach(r => r.classList.remove('drag-over'));
      const dropIdx = parseInt(row.dataset.idx);
      if (dragIdx === null || dragIdx === dropIdx) return;

      const item = ids.splice(dragIdx, 1)[0];
      ids.splice(dropIdx, 0, item);

      try {
        await apiPut(endpoint, { order: ids }, adminPassword);
        refreshFn();
      } catch (err) { alert('Reorder failed: ' + err.message); }
    });
  });
}

function headerHTML(subtitle) {
  return `
    <div class="craigslist-header">
      <a href="#/" class="craigslist-title">${esc(S.siteTitle)}</a>
      <div class="craigslist-subtitle">${esc(subtitle || S.subtitle)}</div>
    </div>`;
}

function navHTML(extra) {
  return `
    <div class="craigslist-nav">
      <a href="#/">for sale</a>
      <a href="#/missed-connections">missed connections</a>
      <a href="#/jobs">jobs</a>
      <a href="#/news">community news</a>
      <a href="#/horoscopes">horoscopes</a>
      <a href="#/deer-abbott">deer abbott</a>
      <a href="#/about">about</a>
      <a href="#/contact">contact</a>
      <a href="${esc(S.liveMarketplaceUrl || '#/darkweb')}" ${(S.liveMarketplaceUrl && !S.liveMarketplaceUrl.startsWith('#')) ? 'target="_blank" rel="noopener noreferrer"' : ''}>${esc(S.liveMarketplaceLabel || 'live marketplace')}</a>
      ${extra || ''}
      <span style="float:right;font-size:11px">search tips | posting guidelines</span>
    </div>`;
}

function footerHTML() {
  return `
    <div class="craigslist-footer">
      &copy; ${new Date().getFullYear()} ${esc(S.footerText)}<br>
      <span class="footer-links">${esc(S.footerLinks)}</span><br>
      <span style="font-size:10px;color:#999999"><a href="#/bsod" style="color:#999999">do not click here</a></span>
    </div>`;
}

// ===== PAGES =====

// --- HOME PAGE ---
async function renderHome() {
  const app = document.getElementById('app');
  const hash = location.hash;
  const catMatch = hash.match(/[?&]cat=([^&]+)/);
  let selectedCat = catMatch ? decodeURIComponent(catMatch[1]) : 'all';
  const cats = S.categories || [];

  app.innerHTML = headerHTML() + navHTML() + `<div class="loading">loading listings...</div>` + footerHTML();

  let listings = [];
  try {
    const catParam = selectedCat !== 'all' ? `?category=${encodeURIComponent(selectedCat)}` : '';
    listings = await apiGet('/listings' + catParam);
  } catch (e) {
    app.innerHTML = headerHTML() + navHTML() +
      `<div style="padding:20px;text-align:center;color:#cc0000">failed to load listings. the void has consumed the database.</div>` +
      footerHTML();
    return;
  }

  const sidebarLinks = cats.map(c =>
    `<a href="#/?cat=${c.id}" class="${selectedCat === c.id ? 'active' : ''}">${c.name.toLowerCase()}</a>`
  ).join('');

  const catOptions = cats.map(c =>
    `<option value="${c.id}" ${selectedCat === c.id ? 'selected' : ''}>${c.name.toLowerCase()}</option>`
  ).join('');

  const safetyHTML = (S.safetyTips || '').split('\n').map(t => `&bull; ${esc(t.trim())}`).join('<br>');

  const listHTML = listings.length > 0 ? listings.map(l => `
    <div class="listing-row">
      ${l.image ? `<img src="${esc(l.image)}" alt="${esc(l.title)}" class="listing-image" onerror="this.style.display='none'">` : ''}
      <div class="listing-info">
        <div class="listing-title">
          <a href="#/listing/${l.id}">$${l.price} - ${esc(l.title)}</a>
          <span class="${statusClass(l.status)}" style="margin-left:10px;font-size:11px">(${l.status.toLowerCase()})</span>
        </div>
        <div class="listing-meta">${esc(l.location)} - ${formatDate(l.postedDate)}</div>
        <div class="listing-actions">
          <a href="#/listing/${l.id}">read full description</a> |
          <a href="${esc(l.facebookUrl)}" target="_blank" rel="noopener noreferrer"> view on facebook</a>
        </div>
      </div>
    </div>
  `).join('') : '';

  const galleryHTML = listings.length > 0 ? `<div class="gallery-grid">${listings.map(l => `
    <a href="#/listing/${l.id}" class="gallery-card">
      ${l.image ? `<img src="${esc(l.image)}" alt="${esc(l.title)}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22160%22><rect fill=%22%23eee%22 width=%22200%22 height=%22160%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23999%22 font-size=%2214%22>no image</text></svg>'">` : `<div style="width:100%;height:160px;background:#eee;display:flex;align-items:center;justify-content:center;color:#999;font-size:13px;margin-bottom:8px">no image</div>`}
      <div class="gallery-price">$${l.price}</div>
      <div class="gallery-title">${esc(l.title)}</div>
      <div class="gallery-meta">${esc(l.location)}</div>
    </a>
  `).join('')}</div>` : '';

  const emptyHTML = listings.length === 0 ? `
    <div style="padding:20px;text-align:center;color:#666666">
      ${nl2br(S.emptyListingsMsg || 'no listings found in this category.')}
    </div>` : '';

  app.innerHTML = headerHTML() + navHTML() + `
    <div class="category-filter">

async function renderHoroscopes() {
  const app = document.getElementById('app');
  app.innerHTML = headerHTML('colorado springs > horoscopes') + navHTML() + `<div class="loading">consulting the stars...</div>` + footerHTML();

  let periods = [];
  try {
    periods = await apiGet('/horoscopes/periods');
  } catch (e) { /* no periods yet — start fresh */ }

  // Determine selected period
  const hash = location.hash;
  const periodMatch = hash.match(/[?&]period=([^&]+)/);
  let selectedPeriod = periodMatch ? decodeURIComponent(periodMatch[1]) : (periods[0] || '');

  let readings = [];
  if (selectedPeriod) {
    try {
      readings = await apiGet('/horoscopes?period=' + encodeURIComponent(selectedPeriod));
    } catch (e) { /* empty */ }
  }

  const readingMap = {};
  for (const r of readings) readingMap[r.sign] = r;

  const periodOptions = periods.map(p =>
    `<option value="${esc(p)}" ${p === selectedPeriod ? 'selected' : ''}>${esc(p)}</option>`
  ).join('');

  const periodBar = periods.length > 0
    ? `<div class="horoscope-period-bar">
        <label><strong>period:</strong>
          <select id="periodSelect">${periodOptions}</select>
        </label>
      </div>`
    : `<div class="horoscope-period-bar"><span class="no-periods">no horoscopes published yet. the stars are still deciding.</span></div>`;

  const cards = SIGNS.map(s => {
    const r = readingMap[s.id];
    const hasReading = !!r;
    return `
      <div class="horoscope-card${hasReading ? '' : ' empty'}" data-sign="${s.id}">
        <span class="horoscope-sign">${s.symbol}</span>
        <div class="horoscope-name">${esc(s.name)}</div>
        <div class="horoscope-dates">${esc(s.dates)}</div>
        ${hasReading ? `
          <div class="horoscope-body" id="hbody-${s.id}">
            ${esc(r.fullText)}
            ${r.luckyItem ? `<div class="horoscope-lucky">★ lucky item: ${esc(r.luckyItem)}</div>` : ''}
          </div>` : `<div class="horoscope-body" id="hbody-${s.id}"></div>`}
      </div>`;
  }).join('');

  app.innerHTML = headerHTML('colorado springs > horoscopes') + navHTML() + `
    <div class="main-layout">
      <div class="sidebar">
        <div class="sidebar-box">
          <strong>signs</strong>
          <div class="sidebar-links">
            ${SIGNS.map(s => `<a href="#" class="sign-jump" data-sign="${s.id}">${s.symbol} ${s.name}</a>`).join('')}
          </div>
        </div>
        <div class="sidebar-box">
          <div class="safety-tips" style="font-style:italic;color:#666">
            the stars are not responsible<br>for your purchasing decisions.<br>your purchasing decisions<br>are responsible for your<br>purchasing decisions.
          </div>
        </div>
      </div>
      <div class="content">
        <div class="content-intro">
          <strong>HOROSCOPES</strong> - cosmic guidance for confused consumers<br>
          <span class="tagline">(click a sign to reveal your fate | accuracy not guaranteed | void where prohibited)</span>
        </div>
        ${periodBar}
        <div class="horoscope-grid">${cards}</div>
      </div>
    </div>
  ` + footerHTML();

  // Period change
  const sel = document.getElementById('periodSelect');
  if (sel) {
    sel.addEventListener('change', () => {
      location.hash = '#/horoscopes?period=' + encodeURIComponent(sel.value);
    });
  }

  // Click to expand/collapse
  document.querySelectorAll('.horoscope-card').forEach(card => {
    card.addEventListener('click', () => {
      const sign = card.dataset.sign;
      const body = document.getElementById('hbody-' + sign);
      if (!body || !body.textContent.trim()) return;
      const isOpen = body.classList.contains('open');
      // Close all
      document.querySelectorAll('.horoscope-body').forEach(b => b.classList.remove('open'));
      document.querySelectorAll('.horoscope-card').forEach(c => c.classList.remove('active'));
      if (!isOpen) {
        body.classList.add('open');
        card.classList.add('active');
      }
    });
  });

  // Sidebar jump links
  document.querySelectorAll('.sign-jump').forEach(a => {
    a.addEventListener('click', (e) => {
      e.preventDefault();
      const sign = a.dataset.sign;
      const card = document.querySelector(`.horoscope-card[data-sign="${sign}"]`);
      if (!card) return;
      const body = document.getElementById('hbody-' + sign);
      if (body && body.textContent.trim()) {
        document.querySelectorAll('.horoscope-body').forEach(b => b.classList.remove('open'));
        document.querySelectorAll('.horoscope-card').forEach(c => c.classList.remove('active'));
        body.classList.add('open');
        card.classList.add('active');
      }
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  });
}

const ADMIN_SIGNS = [
  { id: 'aries', symbol: '♈', name: 'Aries' },
  { id: 'taurus', symbol: '♉', name: 'Taurus' },
  { id: 'gemini', symbol: '♊', name: 'Gemini' },
  { id: 'cancer', symbol: '♋', name: 'Cancer' },
  { id: 'leo', symbol: '♌', name: 'Leo' },
  { id: 'virgo', symbol: '♍', name: 'Virgo' },
  { id: 'libra', symbol: '♎', name: 'Libra' },
  { id: 'scorpio', symbol: '♏', name: 'Scorpio' },
  { id: 'sagittarius', symbol: '♐', name: 'Sagittarius' },
  { id: 'capricorn', symbol: '♑', name: 'Capricorn' },
  { id: 'aquarius', symbol: '♒', name: 'Aquarius' },
  { id: 'pisces', symbol: '♓', name: 'Pisces' },
];

async function renderHoroscopesAdmin() {
  const panel = document.getElementById('adminHoroscopesPanel');
  panel.innerHTML = `<div class="loading">loading...</div>`;

  let periods = [];
  try { periods = await apiGet('/horoscopes/periods'); } catch (e) {}

  // Default to current month/year
  const now = new Date();
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const currentPeriod = monthNames[now.getMonth()] + ' ' + now.getFullYear();
  if (!periods.includes(currentPeriod)) periods = [currentPeriod, ...periods];

  let selectedPeriod = periods[0] || currentPeriod;

  function renderPanel(period) {
    panel.innerHTML = `
      <div style="margin-bottom:15px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <label><strong>Period:</strong>
          <select id="adminPeriodSelect" style="margin-left:5px">
            ${periods.map(p => `<option value="${esc(p)}" ${p === period ? 'selected' : ''}>${esc(p)}</option>`).join('')}
          </select>
        </label>
        <input type="text" id="newPeriodInput" placeholder="or type new period (e.g. May 2026)" style="width:200px">
        <button class="btn" id="usePeriodBtn">use this period</button>
      </div>
      <div id="horoscopeSignGrid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px">
        <div class="loading">loading signs...</div>
      </div>
      <div id="horoscopeFormArea" style="display:none"></div>
    `;

    document.getElementById('usePeriodBtn').addEventListener('click', () => {
      const val = document.getElementById('newPeriodInput').value.trim();
      if (val) {
        if (!periods.includes(val)) periods = [val, ...periods];
        renderPanel(val);
      }
    });

    document.getElementById('adminPeriodSelect').addEventListener('change', (e) => {
      renderPanel(e.target.value);
    });

    loadSignGrid(period);
  }

  async function loadSignGrid(period) {
    const grid = document.getElementById('horoscopeSignGrid');
    let readings = [];
    try { readings = await apiAdminGet('/horoscopes?period=' + encodeURIComponent(period), adminPassword); } catch (e) {}
    const readingMap = {};
    for (const r of readings) readingMap[r.sign] = r;

    grid.innerHTML = ADMIN_SIGNS.map(s => {
      const r = readingMap[s.id];
      return `
        <div class="horoscope-card" data-sign="${s.id}" style="cursor:pointer" title="${r ? 'click to edit' : 'click to add'}">
          <span class="horoscope-sign">${s.symbol}</span>
          <div class="horoscope-name">${esc(s.name)}</div>
          <div class="horoscope-dates" style="${r ? (r.isDraft ? 'color:#cc6600' : 'color:#006600') : 'color:#999'}">
            ${r ? (r.isDraft ? '✎ draft' : '✓ published') : '— empty'}
          </div>
          ${r ? `<div style="font-size:10px;color:#666;margin-top:4px;overflow:hidden;max-height:30px">${esc(r.fullText.substring(0,60))}…</div>` : ''}
        </div>`;
    }).join('');

    grid.querySelectorAll('.horoscope-card').forEach(card => {
      card.addEventListener('click', () => {
        const sign = card.dataset.sign;
        const existing = readingMap[sign] || null;
        showHoroscopeForm(period, sign, existing, () => loadSignGrid(period));
      });
    });
  }

  renderPanel(selectedPeriod);
}

function showHoroscopeForm(period, sign, existing, onSave) {
  const formArea = document.getElementById('horoscopeFormArea');
  const grid = document.getElementById('horoscopeSignGrid');
  const signMeta = ADMIN_SIGNS.find(s => s.id === sign);
  formArea.style.display = 'block';
  grid.style.display = 'none';

  formArea.innerHTML = `
    <h2 style="font-size:16px;margin-bottom:15px">
      ${signMeta.symbol} ${esc(signMeta.name)} &mdash; ${esc(period)}
      ${existing ? '' : '<span style="color:#cc6600;font-size:12px">(new)</span>'}
    </h2>
    <div class="form-group">
      <label>Full Reading:</label>
      <textarea id="h_fullText" rows="8" placeholder="Write the horoscope here...">${existing ? esc(existing.fullText) : ''}</textarea>
    </div>
    <div class="form-group">
      <label>Lucky Item (optional):</label>
      <input type="text" id="h_luckyItem" value="${existing ? esc(existing.luckyItem) : ''}" placeholder="e.g. That stainless steel garbage can">
    </div>
    <div style="margin-top:15px">
      <button class="btn btn-primary" id="hSaveBtn">${existing ? (existing.isDraft ? 'Publish' : 'Save Changes') : 'Publish'}</button>
      <button class="btn" id="hDraftBtn" style="margin-left:10px;color:#cc6600">${existing && existing.isDraft ? 'Keep as Draft' : 'Save as Draft'}</button>
      <button class="btn" id="hCancelBtn" style="margin-left:10px">Cancel</button>
      ${existing ? `<button class="btn btn-danger" id="hDeleteBtn" style="margin-left:10px">Delete</button>` : ''}
    </div>
    <div id="hFormMsg"></div>
  `;

  document.getElementById('hCancelBtn').addEventListener('click', () => {
    formArea.style.display = 'none';
    grid.style.display = '';
  });

  if (existing) {
    document.getElementById('hDeleteBtn').addEventListener('click', async () => {
      if (!confirm(`Delete ${signMeta.name} horoscope for ${period}?`)) return;

        await apiDelete('/admin/horoscopes/' + existing.id, adminPassword);

      return;
    }
    try {
      if (existing) {
        await apiPut('/admin/horoscopes/' + existing.id, data, adminPassword);

  }
  document.getElementById('hSaveBtn').addEventListener('click', () => submitHoroscope(false));
  document.getElementById('hDraftBtn').addEventListener('click', () => submitHoroscope(true));
}

      container.innerHTML = '<div style="color:#666;padding:10px">no columns yet. the deer awaits her first letter.</div>';
      return;
    }
    container.innerHTML = items.map((item, idx) => `
      <div class="admin-listing-row drag-row" draggable="true" data-id="${item.id}" data-idx="${idx}">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="drag-handle">&#9776;</span>
          <span style="color:#999;font-size:11px;min-width:20px">${idx + 1}.</span>
          <strong>${esc(item.subject)}</strong>
          <span style="font-size:11px;color:#666;font-style:italic">&mdash; ${esc(item.letterFrom)}</span>
          ${item.isDraft ? '<span style="color:#cc6600;font-size:11px;font-weight:bold;margin-left:5px">[draft]</span>' : ''}
        </div>
        <div class="actions">
          <a href="#" class="da-edit-btn" data-id="${item.id}">edit</a>
          <a href="#" class="da-delete-btn btn-danger" data-id="${item.id}" data-subject="${esc(item.subject)}">delete</a>
        </div>
      </div>
    `).join('');

    setupDragDrop(container, items.map(i => i.id), '/admin/reorder-deer-abbott', () => renderDeerAbbottAdmin());

    container.querySelectorAll('.da-edit-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.preventDefault();
        const item = await apiGet('/deer-abbott/' + btn.dataset.id);
        showDeerAbbottForm(item);
      });
    });

    container.querySelectorAll('.da-delete-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.preventDefault();
        if (confirm(`Delete "${btn.dataset.subject}"? This cannot be undone.`)) {
          try {
            await apiDelete('/admin/deer-abbott/' + btn.dataset.id, adminPassword);
            renderDeerAbbottAdmin();
          } catch (err) { alert('Delete failed: ' + err.message); }
        }
      });
    });
  } catch (e) {
    document.getElementById('daList').innerHTML = `<div class="msg-error">failed to load: ${esc(e.message)}</div>`;
  }
}

// Auto-extract price and location from pasted ad text
function autoExtract(fullText) {
  let price = 0;
  const priceMatch = fullText.match(/\$\s?(\d+(?:\.\d{2})?)/);
  if (priceMatch) price = parseFloat(priceMatch[1]);

  let location = 'Colorado Springs, CO';
  const locMatch = fullText.match(/(?:in|from|near)\s+([A-Z][a-z]+(?:\s+[A-Z][a-z]+)*,?\s*[A-Z]{2})/);
  if (locMatch) location = locMatch[1].trim();

  return { price, location };
}

  const fakeHex = (len) => Math.floor(Math.random() * Math.pow(16, len)).toString(16).toUpperCase().padStart(len, '0');
  const addr = () => fakeHex(4) + ':' + fakeHex(8);
  const stop1 = fakeHex(8), stop2 = fakeHex(8), stop3 = fakeHex(8), stop4 = fakeHex(8);
  const baseAddr = fakeHex(8), stamp = fakeHex(8);

  const stopCodes = [
    'PAGE_FAULT_IN_CONSUMER_CAPITALISM',
    'IRQL_NOT_LESS_OR_EQUAL_TO_YOUR_EXPECTATIONS',
    'UNEXPECTED_KERNEL_MODE_EXISTENTIAL_TRAP',
    'DRIVER_OVERRAN_STACK_BUFFER_OF_DESPAIR',
    'MEMORY_MANAGEMENT_IS_A_METAPHOR',
    'BAD_POOL_CALLER_TURNED_OUT_TO_BE_YOU',
    'EXCEPTION_IN_NONPAGED_MARKETPLACE_AREA',
    'FATAL_ERROR_IN_DECISION_MAKING_SUBSYSTEM',
  ];
  const code = stopCodes[Math.floor(Math.random() * stopCodes.length)];

  // Win9x button style helpers
  const btnUp   = '1px 1px 0 #ffffff, -1px -1px 0 #808080, 1px -1px 0 #808080, -1px 1px 0 #ffffff, inset 1px 1px 0 #dfdfdf';
  const btnDown = 'inset 1px 1px 0 #808080, inset -1px -1px 0 #ffffff';

  app.innerHTML = `
    <div style="background:#000080;color:#c0c0c0;font-family:'Courier New',Courier,monospace;font-size:14px;line-height:1.6;min-height:100vh;padding:0;margin:-10px;position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;overflow:auto;box-sizing:border-box">
      <div style="max-width:740px;margin:0 auto;padding:30px 20px">

        <div style="background:#c0c0c0;color:#000080;padding:2px 8px;display:inline-block;margin-bottom:20px;font-weight:bold;font-size:14px">Windows</div>

        <p style="margin:0 0 16px">A fatal exception 0E has occurred at ${addr()} in VxD VMM(04) +<br>
        ${fakeHex(8)}. The current application will be terminated.</p>

        <p style="margin:0 0 6px">&bull;&nbsp; Press any key to terminate the current application.</p>
        <p style="margin:0 0 6px">&bull;&nbsp; Press CTRL+ALT+DEL again to restart your computer. You will<br>
        &nbsp;&nbsp;&nbsp;lose any unsaved information in all applications.</p>

        <p style="margin:16px 0">&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;</p>

        <p style="margin:0 0 4px;color:#ffffff">*** STOP: 0x0000${stop1} (0x${stop2}, 0x${stop3}, 0x00000000, 0x${stop4})</p>
        <p style="margin:0 0 16px;color:#ffffff">${code}</p>

        <p style="margin:0 0 12px">If this is the first time you've seen this Stop error screen,<br>
        restart your computer. If this screen appears again, follow<br>
        these steps:</p>

        <p style="margin:0 0 12px">Check to make sure any new hardware or software is properly installed.<br>
        If this is a new installation, ask your hardware or software manufacturer<br>
        for any Windows updates you might need.</p>

        <p style="margin:0 0 12px">If problems continue, disable or remove any newly installed hardware<br>
        or software. Disable BIOS memory options such as caching or shadowing.<br>
        If you need to use Safe Mode to remove or disable components, restart<br>
        your computer, press F8 to select Advanced Startup Options, and then<br>
        select Safe Mode.</p>

        <p style="margin:16px 0">&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;</p>

        <p style="margin:0 0 4px">Technical information:</p>
        <p style="margin:0 0 4px;color:#ffffff">*** STOP: 0x0000000A (0x${fakeHex(8)}, 0x00000002, 0x00000001, 0x${fakeHex(8)})</p>
        <p style="margin:0 0 16px;color:#ffffff">    ${code}</p>

        <p style="margin:0 0 4px;color:#ffffff">*** ADDRESS 0x${baseAddr} base at 0x${fakeHex(8)}, DateStamp ${stamp} - ntoskrnl.exe</p>
        <p style="margin:0 0 4px;color:#ffffff">*** ADDRESS 0x${fakeHex(8)} base at 0x${fakeHex(8)}, DateStamp ${fakeHex(8)} - win32k.sys</p>
        <p style="margin:0 0 4px;color:#ffffff">*** ADDRESS 0x${fakeHex(8)} base at 0x${fakeHex(8)}, DateStamp ${fakeHex(8)} - hal.dll</p>

        <p style="margin:16px 0">&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;</p>

        <p style="margin:0 0 4px">Beginning dump of physical memory</p>
        <p style="margin:0 0 4px">${[...Array(4)].map(() => [...Array(8)].map(() => fakeHex(8)).join(' ')).join('<br>')}</p>
        <p style="margin:12px 0 4px">Physical memory dump complete.</p>
        <p style="margin:0 0 0">Contact your system administrator or technical support group for further assistance.</p>
      </div>
    </div>

    <!-- Win9x dialog — hidden until setTimeout -->
    <div id="bsod-overlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:10000;display:flex;align-items:center;justify-content:center">
      <div id="bsod-dialog" style="width:360px;background:#c0c0c0;border:2px solid;border-color:#ffffff #808080 #808080 #ffffff;box-shadow:1px 1px 0 #000;font-family:Arial,sans-serif;font-size:12px;color:#000000">
        <!-- title bar -->
        <div style="background:#000080;color:#ffffff;font-weight:bold;font-size:12px;padding:3px 5px;display:flex;justify-content:space-between;align-items:center;user-select:none">
          <span>Illegal Operation</span>
          <span style="background:#c0c0c0;color:#000;border:1px solid;border-color:#fff #808080 #808080 #fff;width:16px;height:14px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;cursor:default">&#x2715;</span>
        </div>
        <!-- body -->
        <div id="bsod-dialog-body" style="padding:18px 16px 12px">
          <div style="display:flex;align-items:flex-start;gap:14px;margin-bottom:16px">
            <div style="flex-shrink:0;width:32px;height:32px;background:#ff0000;border-radius:50%;color:#fff;font-weight:bold;font-size:18px;display:flex;align-items:center;justify-content:center;line-height:1">✕</div>
            <div style="line-height:1.6">
              This program has performed an illegal operation<br>
              and will be shut down.<br><br>
              If the problem persists, contact the program vendor.
            </div>
          </div>
          <div style="text-align:center">
            <button id="bsod-ok" style="width:75px;height:23px;background:#c0c0c0;border:2px solid;border-color:#ffffff #808080 #808080 #ffffff;font-family:Arial,sans-serif;font-size:12px;cursor:pointer;box-shadow:${btnUp}">OK</button>
          </div>
        </div>
      </div>
    </div>
  `;

  // Show dialog after a beat — let them stew in the blue for a moment
  const overlay = document.getElementById('bsod-overlay');
  setTimeout(() => { overlay.style.display = 'flex'; }, 1500);

  const threshold = Math.random() < 0.5 ? 3 : 4;
  let clicks = 0;

  document.getElementById('bsod-ok').addEventListener('click', function() {
    clicks++;
    if (clicks < threshold) {
      // Visually depress the button but do nothing
      this.style.borderColor = '#808080 #ffffff #ffffff #808080';
      this.style.boxShadow = btnDown;
      this.style.paddingTop = '2px';
      const btn = this;
      setTimeout(() => {
        btn.style.borderColor = '#ffffff #808080 #808080 #ffffff';
        btn.style.boxShadow = btnUp;
        btn.style.paddingTop = '';
      }, 120);
    } else {
      // Punchline
      document.getElementById('bsod-dialog-body').innerHTML = `
        <div style="padding:10px 4px 16px;line-height:2;text-align:center">
          You just had to click it.<br>
          Couldn't help yourself.<br>
          I'm not mad. Just disappointed.
        </div>
        <div style="text-align:center">
          <button id="bsod-ok-final" style="width:75px;height:23px;background:#c0c0c0;border:2px solid;border-color:#ffffff #808080 #808080 #ffffff;font-family:Arial,sans-serif;font-size:12px;cursor:pointer;box-shadow:${btnUp}">OK</button>
        </div>
      `;
      document.getElementById('bsod-ok-final').addEventListener('click', () => { location.hash = '#/'; });
    }
  });
}

// ===== ROUTER =====
async function route() {
  if (!S) await loadSettings();
  const hash = location.hash || '#/';
  const path = hash.split('?')[0];

  if (path === '#/' || path === '#') {
    renderHome();
  } else if (path.startsWith('#/listing/')) {
    renderListing(path.replace('#/listing/', ''));
  } else if (path === '#/missed-connections') {
    renderMissedConnections();
  } else if (path.startsWith('#/missed-connections/')) {
    renderMissedConnection(path.replace('#/missed-connections/', ''));
  } else if (path === '#/jobs') {
    renderJobs();
  } else if (path.startsWith('#/jobs/')) {
    renderJob(path.replace('#/jobs/', ''));
  } else if (path === '#/news') {
    renderNews();
  } else if (path.startsWith('#/news/')) {
    renderNewsItem(path.replace('#/news/', ''));
  } else if (path === '#/horoscopes') {
    renderHoroscopes();
  } else if (path === '#/deer-abbott') {
    renderDeerAbbott();
  } else if (path.startsWith('#/deer-abbott/')) {
    renderDeerAbbottItem(path.replace('#/deer-abbott/', ''));
  } else if (path === '#/contact') {
    renderContact();
  } else if (path === '#/darkweb') {
    renderDarkWeb();
  } else if (path === '#/bsod') {
    renderBSOD();
  } else if (path === '#/about') {
    renderAbout();
  } else if (path === '#/admin') {
    renderAdmin();
  } else {
    renderHome();
  }
  window.scrollTo(0, 0);
  if (typeof gtag !== 'undefined') gtag('event', 'page_view', { page_path: location.pathname + location.hash });
}

window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', () => {
  if (!location.hash) location.hash = '#/';
  route();
});
</script>
